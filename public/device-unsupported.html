<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>设备运行环境需要更新</title><style>body{background:#eaf8f5;color:#163846;font:20px/1.7 sans-serif;margin:8vw;max-width:700px}h1{font-size:28px}button{font:inherit;padding:12px 24px;border:0;border-radius:20px;background:#236e59;color:white}</style><h1>请家长帮忙更新运行环境</h1><p>宝可梦小小训练师需要 Android 7.0 或更新版本，以及 111 或更新版本的 Android System WebView，并需要支持 WebGL 2 的设备。</p><p>请通过设备官方应用商店或系统更新升级 WebView。学习机可能需要厂商提供更新；安装 APK 本身不会升级系统内核。</p><p>如果已经更新，请完全关闭应用后重新打开。也可以换一台支持的安卓设备进行测试。</p><button onclick="location.href='/'">重新打开</button></html>
