<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokéPal · 157 只宝可梦 3D 资源</title><link rel="icon" href="/icons/icon-192.png">
<style>*{box-sizing:border-box}body{margin:0;background:#edf4ef;color:#233b36;font:15px system-ui;padding:24px}header,main,footer{max-width:1400px;margin:auto}h1{font-size:28px;margin:0 0 8px}p{line-height:1.6}.viewer{display:grid;grid-template-columns:2fr 1fr;background:#fff;border-radius:18px;overflow:hidden;margin:20px 0}#stage{height:420px}canvas{display:block}aside{padding:24px}button,input{border:1px solid #b7cabc;background:white;padding:10px;border-radius:9px;color:inherit;font:inherit}button{cursor:pointer}button:hover{background:#e6f2e6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{padding:10px;border-radius:12px;border:1px solid #d3e0d7;background:white;text-align:left}.card img{width:100%;height:145px;object-fit:contain}.card span{display:block;font-size:13px}.card small{color:#62806d}#search{width:100%;margin-bottom:16px}footer{padding:24px 0;font-size:13px;line-height:1.7}audio{max-width:100%}@media(max-width:900px){#grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){body{padding:12px}.viewer{grid-template-columns:1fr}#stage{height:320px}#grid{grid-template-columns:repeat(2,1fr)}}
</style><header><p><a href="/docs/pogo-kanto-review.html">查看最新完整初代 151 只图鉴（共 157 只）</a></p><h1>157 只宝可梦 · 3D 资源总览</h1><p>点击卡片查看待机、移动和叫声；拖动模型可旋转。<a href="/">返回家园</a> · <a href="/docs/pogo-review.html">首批样本对比</a></p><div id="progress">正在逐只检查和生成预览…</div></header>
<main><div class="viewer"><div id="stage"></div><aside><h2 id="name">加载中</h2><img id="art" width="100" height="100" style="object-fit:contain" alt="原立绘对照"><p id="stats"></p><div class="actions"><button id="idle">待机</button><button id="walk">移动</button><button id="pause">暂停 / 播放</button><button id="front">正面</button><button id="side">侧面</button></div><audio id="cry" controls preload="none"></audio><p id="crySource"></p></aside></div><input id="search" aria-label="搜索宝可梦" placeholder="搜索编号、中文或英文名字"><div id="grid"></div></main>
<footer>模型：PokeMiners Pokémon GO 资源存档（固定于 2020-11-27）。151 只叫声来自 Pokémon GO 0.29.0 APK；6 只第二世代宝可梦保留原有叫声。保留原始骨骼与循环动作；表情固定，火焰使用简化材质。此页共用一个 WebGL 渲染器。iPad 真机性能仍需实测。</footer>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';import {OrbitControls} from 'three/examples/jsm/controls/OrbitControls.js';import {normalizeModel} from '/src/scene/modelUtil.ts';import roster from '/src/data/pokemon.json';import manifest from '/src/data/pokemonModels.json';
const $=s=>document.querySelector(s),host=$('#stage');const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;host.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#dcebe2');scene.add(new THREE.HemisphereLight(0xffffff,0xa1b7a5,2));const sun=new THREE.DirectionalLight(0xfff5df,2.3);sun.position.set(3,5,4);scene.add(sun);
const camera=new THREE.PerspectiveCamera(36,1,.01,100);const controls=new OrbitControls(camera,renderer.domElement);const loader=new GLTFLoader();let model,mixer,actions,paused=false,current,serial=0,busy=true,distance=5,centerY=.8;
const review=window.batchReview={ready:false,errors:[],models:[],select};
function dispose(){if(!model)return;scene.remove(model);mixer.stopAllAction();mixer.uncacheRoot(model);const textures=new Set();model.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of [o.material].flat()){for(const v of Object.values(m))if(v?.isTexture)textures.add(v);m.dispose()}if(o.isSkinnedMesh)o.skeleton.dispose()}});textures.forEach(t=>t.dispose());model=null}
function fit(){const box=new THREE.Box3().setFromObject(model,true),size=box.getSize(new THREE.Vector3());centerY=(box.min.y+box.max.y)/2;distance=Math.max(size.y,size.x/camera.aspect,size.z)*1.9+.6;camera.position.set(distance*.25,centerY+distance*.14,distance);controls.target.set(0,centerY,0);controls.update()}
function refresh(){model.updateMatrixWorld(true);model.traverse(o=>{if(o.isSkinnedMesh)o.skeleton.update()})}
async function load(id){dispose();const g=await loader.loadAsync(`/models/pokemon/${manifest[id].file}`);model=normalizeModel(g.scene,manifest[id],{height:1.6},g.animations);scene.add(model);mixer=new THREE.AnimationMixer(model);actions=Object.fromEntries(g.animations.map(c=>[c.name,mixer.clipAction(c)]));actions.idle.play();mixer.update(.01);refresh();return g}
async function select(id){if(busy)return;busy=true;try{current=roster.find(p=>p.id===id);const g=await load(id);renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();fit();$('#name').textContent=`#${id} ${current.nameZh} ${current.nameEn}`;$('#art').src=`/pokemon/art/${id}.png`;$('#cry').src=`/pokemon/cry/${id}.m4a`;$('#crySource').textContent=id<=151?'APK 原版叫声':'保留现有叫声';$('#stats').textContent=g.animations.map(c=>`${c.name==='idle'?'待机':'移动'} ${c.duration.toFixed(2)} 秒`).join(' · ');review.current={id,model,mixer,actions}}catch(e){review.errors.push({id,error:String(e)})}finally{busy=false}}
for(const p of roster){try{const g=await load(p.id);const result={id:p.id,normalizationScale:model.scale.x,clips:[],triangles:0,skinned:0,textures:0};const ts=new Set();model.traverse(o=>{if(o.isMesh){result.triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;for(const m of [o.material].flat())if(m.map)ts.add(m.map.uuid)}if(o.isSkinnedMesh)result.skinned++});result.textures=ts.size;
 for(const clip of g.animations){mixer.stopAllAction();const action=actions[clip.name].reset().play();mixer.update(0);refresh();const bones=[];model.traverse(o=>{if(o.isBone)bones.push(o)});const start=bones.map(b=>b.matrixWorld.elements.slice());const bounds=[];for(const t of [0,.25,.5,.75]){mixer.setTime(clip.duration*t);refresh();const b=new THREE.Box3().setFromObject(model,true);bounds.push({min:b.min.toArray(),max:b.max.toArray()})}const motion=bones.reduce((n,b,i)=>n+b.matrixWorld.elements.reduce((s,v,j)=>s+Math.abs(v-start[i][j]),0),0);if(!Number.isFinite(motion)||!bounds.every(b=>[...b.min,...b.max].every(Number.isFinite)))throw Error('non-finite animation');result.clips.push({name:clip.name,duration:clip.duration,tracks:clip.tracks.length,motion,bounds})}
 if(result.skinned===0||result.clips.length!==2||result.clips.some(c=>c.motion<.00001||c.bounds[0].max[1]-.5<c.bounds[0].min[1]||Math.abs(c.bounds[0].min[1])>.01))throw Error('missing skin or motion');
 mixer.stopAllAction();actions.idle.reset().play();mixer.update(.01);refresh();renderer.setSize(300,240);camera.aspect=1.25;camera.updateProjectionMatrix();fit();renderer.render(scene,camera);const card=document.createElement('button');card.className='card';card.dataset.search=`${p.id} ${p.nameZh} ${p.nameEn}`.toLowerCase();const img=document.createElement('img');img.src=renderer.domElement.toDataURL('image/png');img.alt=p.nameZh;card.append(img);const label=document.createElement('span');label.textContent=`#${p.id} ${p.nameZh}`;card.append(label);const sub=document.createElement('small');sub.textContent=p.nameEn;card.append(sub);card.onclick=()=>{select(p.id);host.scrollIntoView({behavior:'smooth',block:'center'})};$('#grid').append(card);review.models.push(result)
 }catch(e){review.errors.push({id:p.id,error:String(e)})}$('#progress').textContent=`已检查 ${review.models.length} / ${roster.length} · 异常 ${review.errors.length}`;await new Promise(r=>setTimeout(r,0))}
busy=false;await select(25);review.ready=true;
for(const clip of ['idle','walk'])$('#'+clip).onclick=()=>{mixer.stopAllAction();actions[clip].reset().play()};$('#pause').onclick=()=>paused=!paused;$('#front').onclick=()=>{camera.position.set(0,centerY,distance);controls.update()};$('#side').onclick=()=>{camera.position.set(distance,centerY,0);controls.update()};$('#search').oninput=e=>document.querySelectorAll('.card').forEach(c=>c.hidden=!c.dataset.search.includes(e.target.value.toLowerCase()));
window.addEventListener('resize',()=>{if(busy)return;renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();fit()});const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(!busy&&model){if(!paused)mixer.update(dt);renderer.render(scene,camera)}}frame();
</script></html>
