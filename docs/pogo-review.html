<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéPal · Pokémon GO 资源样本</title><link rel="icon" href="/icons/icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#edf4ef;color:#233b36;font:16px system-ui;padding:28px}h1{font-size:28px;margin:0 0 8px}p{line-height:1.7}header,main,footer{max-width:1400px;margin:auto}.toolbar{display:flex;gap:10px;margin:20px 0}button{padding:10px 18px;border:1px solid #a3b8a9;background:white;border-radius:9px;cursor:pointer}main{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:white;border-radius:18px;overflow:hidden;border:1px solid #d3e0d7}.card h2{padding:0 20px}.before{height:130px;background:#f4f7f2;text-align:center}.before img{height:110px}.stage{height:350px;position:relative}.stage canvas{display:block;width:100%;height:100%}.label{padding:8px 20px;font-size:13px;color:#5c7266}.stats{padding:12px 20px;min-height:80px;font-size:13px;line-height:1.7}footer{font-size:14px;margin-top:20px}@media(max-width:800px){main{grid-template-columns:1fr}.stage{height:300px}}
</style>
<header><p><a href="/docs/pogo-kanto-review.html">查看最新完整初代 151 只图鉴（共 157 只）</a></p><p><a href="/docs/pogo-batch-review.html">查看全部 67 只已接入模型 →</a></p><h1>Pokémon GO · 首批 3D 样本</h1><p>上方：现有立绘　下方：带骨骼的游戏模型。拖动可旋转，滚轮可缩放。模型来自 PokeMiners 的 Pokémon GO 资源存档。</p><div class="toolbar"><button id="idle">待机</button><button id="walk">走路 / 飞行</button><button id="pause">暂停 / 播放</button><button id="front">正面</button><button id="side">侧面</button></div></header>
<main id="cards"></main><footer>原始动作与网格保留。眼睛使用固定睁眼贴图；喷火龙尾焰采用简化材质。叫声来自本次下载的 Pokémon GO 0.29.0 APK。此页用于样本审阅，不代表 iPad 真机验收。</footer>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/examples/jsm/controls/OrbitControls.js';
import {normalizeModel} from '/src/scene/modelUtil.ts';
const items=[[25,'皮卡丘'],[1,'妙蛙种子'],[6,'喷火龙']], views=[];
window.review={ready:false,errors:[],models:[]}; let paused=false;
for(const [id,name] of items){
 const card=document.createElement('section');card.className='card';card.innerHTML=`<h2>#${id} ${name}</h2><div class="before"><img src="/pokemon/art/${id}.png"></div><div class="label">3D 模型 · 拖动查看</div><div class="stage"></div><div class="stats">加载中…</div><div class="label">APK 原版叫声<br><audio controls preload="metadata" src="/pokemon/cry/${id}.m4a" style="width:100%;margin:8px 0"></audio></div>`;document.querySelector('#cards').append(card);
 const host=card.querySelector('.stage'), renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;host.append(renderer.domElement);
 const scene=new THREE.Scene();scene.background=new THREE.Color('#dcebe2');scene.add(new THREE.HemisphereLight(0xffffff,0xa1b7a5,2));const sun=new THREE.DirectionalLight(0xfff5df,2.3);sun.position.set(3,5,4);scene.add(sun);
 const camera=new THREE.PerspectiveCamera(36,host.clientWidth/host.clientHeight,.01,100);camera.position.set(2.4,1.8,4.5);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.9,0);controls.update();
 if(id===6){camera.position.set(3.6,2.8,6.8);controls.target.set(0,1.3,0);controls.update()}
 const floor=new THREE.Mesh(new THREE.CircleGeometry(2.2,64),new THREE.MeshStandardMaterial({color:0xc1d7c4,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);
 try{const gltf=await new GLTFLoader().loadAsync(`/models/pokemon/${id}.glb`);const model=normalizeModel(gltf.scene,{file:`${id}.glb`},{height:1.6},gltf.animations);scene.add(model);const mixer=new THREE.AnimationMixer(model);const actions=Object.fromEntries(gltf.animations.map(c=>[c.name,mixer.clipAction(c)]));actions.idle.play();mixer.update(.01);const stats={id,clips:gltf.animations.map(a=>({name:a.name,duration:a.duration,tracks:a.tracks.length})),meshes:0,skinned:0};model.traverse(o=>{if(o.isMesh)stats.meshes++;if(o.isSkinnedMesh)stats.skinned++;});window.review.models.push(stats);card.querySelector('.stats').textContent=`骨骼网格 ${stats.skinned} · 待机 ${actions.idle.getClip().duration.toFixed(2)} 秒 · 移动 ${actions.walk.getClip().duration.toFixed(2)} 秒`;
 views.push({id,renderer,scene,camera,controls,mixer,model,actions});}catch(e){window.review.errors.push(String(e));card.querySelector('.stats').textContent=String(e);}
}
window.review.ready=true;window.review.views=views;
for(const clip of ['idle','walk'])document.getElementById(clip).onclick=()=>views.forEach(v=>{v.mixer.stopAllAction();v.actions[clip].reset().play()});
document.getElementById('pause').onclick=()=>paused=!paused;
document.getElementById('front').onclick=()=>views.forEach(v=>{v.camera.position.set(0,v.id===6?2:1.3,v.id===6?7.5:5);v.controls.update()});
document.getElementById('side').onclick=()=>views.forEach(v=>{v.camera.position.set(v.id===6?7.5:5,v.id===6?2:1.3,0);v.controls.update()});
window.addEventListener('resize',()=>views.forEach(v=>{const h=v.renderer.domElement.parentElement;v.renderer.setSize(h.clientWidth,h.clientHeight);v.camera.aspect=h.clientWidth/h.clientHeight;v.camera.updateProjectionMatrix()}));
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);views.forEach(v=>{if(!paused)v.mixer.update(dt);v.renderer.render(v.scene,v.camera)})}frame();
</script></html>
